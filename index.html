<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Heart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to bottom, #ffcccc, #ffe6e6);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 20px 0;
            color: #d63384;
        }

        #game-area {
            position: relative;
            background: #fff;
            width: 90vw;
            max-width: 400px;
            height: 70vh;
            max-height: 600px;
            border: 2px solid #d63384;
            border-radius: 10px;
            overflow: hidden;
            touch-action: none;
        }

        #basket {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 30px;
            background: transparent;
            border: 4px solid #d63384;
            border-radius: 0 0 50% 50%;
            border-top: none;
        }

        #heart {
            position: absolute;
            top: 0;
            left: 50%;
            width: 20px;
            height: 20px;
            background: #ff4d4d;
            transform: translate(-50%, 0) rotate(45deg);
        }

        #heart::before,
        #heart::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff4d4d;
            border-radius: 50%;
        }

        #heart::before {
            left: -10px;
        }

        #heart::after {
            top: -10px;
        }

        #score {
            font-size: 24px;
            color: #d63384;
            margin: 20px 0;
        }

        #instructions {
            color: #666;
            margin: 10px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Catch the Heart 💖</h1>
    <div id="game-area">
        <div id="basket"></div>
        <div id="heart"></div>
    </div>
    <p id="score">Score: 0</p>
    <p id="instructions">Use arrow keys or touch/drag to move the basket</p>

    <script>
        const basket = document.getElementById('basket');
        const heart = document.getElementById('heart');
        const scoreDisplay = document.getElementById('score');
        const gameArea = document.getElementById('game-area');
        
        let score = 0;
        let basketPosition = 50;
        let heartPosition = { x: 50, y: 0 };
        let gameSpeed = 2;

        function updateBasketPosition(newPosition) {
            // Constrain basket position to game area
            basketPosition = Math.max(10, Math.min(90, newPosition));
            basket.style.left = `${basketPosition}%`;
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                updateBasketPosition(basketPosition - 5);
            } else if (e.key === 'ArrowRight') {
                updateBasketPosition(basketPosition + 5);
            }
        });

        // Touch controls
        let isDragging = false;

        gameArea.addEventListener('touchstart', (e) => {
            isDragging = true;
            e.preventDefault();
        });

        gameArea.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            
            const touch = e.touches[0];
            const rect = gameArea.getBoundingClientRect();
            const relativeX = touch.clientX - rect.left;
            const newPosition = (relativeX / rect.width) * 100;
            
            updateBasketPosition(newPosition);
            e.preventDefault();
        });

        gameArea.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Mouse controls
        gameArea.addEventListener('mousedown', () => {
            isDragging = true;
        });

        gameArea.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const rect = gameArea.getBoundingClientRect();
            const relativeX = e.clientX - rect.left;
            const newPosition = (relativeX / rect.width) * 100;
            
            updateBasketPosition(newPosition);
        });

        gameArea.addEventListener('mouseup', () => {
            isDragging = false;
        });

        function checkCollision() {
            const basketRect = basket.getBoundingClientRect();
            const heartRect = heart.getBoundingClientRect();

            return !(basketRect.right < heartRect.left || 
                    basketRect.left > heartRect.right || 
                    basketRect.bottom < heartRect.top || 
                    basketRect.top > heartRect.bottom);
        }

        function updateHeart() {
            heartPosition.y += gameSpeed;
            
            if (heartPosition.y >= 95) {
                // Reset heart if missed
                heartPosition.y = 0;
                heartPosition.x = Math.random() * 90 + 5;
            }

            heart.style.top = `${heartPosition.y}%`;
            heart.style.left = `${heartPosition.x}%`;

            if (checkCollision()) {
                // Heart caught
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                heartPosition.y = 0;
                heartPosition.x = Math.random() * 90 + 5;
                gameSpeed += 0.1; // Increase difficulty
            }

            requestAnimationFrame(updateHeart);
        }

        // Start the game
        updateHeart();
    </script>
</body>
</html>
