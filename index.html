<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Heart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to bottom, #ffcccc, #ffe6e6);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 20px 0;
            color: #d63384;
        }

        #game-area {
            position: relative;
            background: #fff;
            width: 90vw;
            max-width: 400px;
            height: 70vh;
            max-height: 600px;
            border: 2px solid #d63384;
            border-radius: 10px;
            overflow: hidden;
            touch-action: none;
        }

        #basket {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 30px;
            background: transparent;
            border: 4px solid #d63384;
            border-radius: 0 0 50% 50%;
            border-top: none;
        }

        #heart {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .heart {
            background-color: #ff4d4d;
            display: inline-block;
            height: 20px;
            margin: 0 10px;
            position: relative;
            top: 0;
            transform: rotate(-45deg);
            width: 20px;
        }

        .heart:before,
        .heart:after {
            content: "";
            background-color: #ff4d4d;
            border-radius: 50%;
            height: 20px;
            position: absolute;
            width: 20px;
        }

        .heart:before {
            top: -10px;
            left: 0;
        }

        .heart:after {
            left: 10px;
            top: 0;
        }

        #score {
            font-size: 24px;
            color: #d63384;
            margin: 20px 0;
        }

        #instructions {
            color: #666;
            margin: 10px 0;
            font-size: 14px;
        }

        .celebration-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            color: #d63384;
            font-weight: bold;
            display: none;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .flower {
            position: absolute;
            font-size: 24px;
            animation: fall 3s linear forwards;
            z-index: 5;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>Catch the Heart 💖</h1>
    <div id="game-area">
        <div id="basket"></div>
        <div id="heart">
            <div class="heart"></div>
        </div>
        <div class="celebration-text">I LOVE YOU HON</div>
    </div>
    <p id="score">Score: 0</p>
    <p id="instructions">Use arrow keys or touch/drag to move the basket</p>

    <script>
        const basket = document.getElementById('basket');
        const heart = document.getElementById('heart');
        const scoreDisplay = document.getElementById('score');
        const gameArea = document.getElementById('game-area');
        const celebrationText = document.querySelector('.celebration-text');
        
        let score = 0;
        let basketPosition = 50;
        let heartPosition = { x: 50, y: 0 };
        let gameSpeed = 2;

        function createFlower() {
            const flowers = ['🌸', '🌺', '🌹', '🌷', '💐', '🌻'];
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
            flower.style.left = Math.random() * 100 + '%';
            document.body.appendChild(flower);
            
            // Remove flower after animation
            setTimeout(() => {
                flower.remove();
            }, 3000);
        }

        function celebrate() {
            celebrationText.style.display = 'block';
            
            // Create flowers
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    createFlower();
                }, i * 100);
            }

            // Hide celebration text after 3 seconds
            setTimeout(() => {
                celebrationText.style.display = 'none';
            }, 3000);
        }

        function updateBasketPosition(newPosition) {
            basketPosition = Math.max(10, Math.min(90, newPosition));
            basket.style.left = `${basketPosition}%`;
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                updateBasketPosition(basketPosition - 5);
            } else if (e.key === 'ArrowRight') {
                updateBasketPosition(basketPosition + 5);
            }
        });

        // Touch controls
        let isDragging = false;

        gameArea.addEventListener('touchstart', (e) => {
            isDragging = true;
            e.preventDefault();
        });

        gameArea.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            
            const touch = e.touches[0];
            const rect = gameArea.getBoundingClientRect();
            const relativeX = touch.clientX - rect.left;
            const newPosition = (relativeX / rect.width) * 100;
            
            updateBasketPosition(newPosition);
            e.preventDefault();
        });

        gameArea.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Mouse controls
        gameArea.addEventListener('mousedown', () => {
            isDragging = true;
        });

        gameArea.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const rect = gameArea.getBoundingClientRect();
            const relativeX = e.clientX - rect.left;
            const newPosition = (relativeX / rect.width) * 100;
            
            updateBasketPosition(newPosition);
        });

        gameArea.addEventListener('mouseup', () => {
            isDragging = false;
        });

        function checkCollision() {
            const basketRect = basket.getBoundingClientRect();
            const heartRect = heart.getBoundingClientRect();

            return !(basketRect.right < heartRect.left || 
                    basketRect.left > heartRect.right || 
                    basketRect.bottom < heartRect.top || 
                    basketRect.top > heartRect.bottom);
        }

        function updateHeart() {
            heartPosition.y += gameSpeed;
            
            if (heartPosition.y >= 95) {
                // Reset heart if missed
                heartPosition.y = 0;
                heartPosition.x = Math.random() * 90 + 5;
            }

            heart.style.top = `${heartPosition.y}%`;
            heart.style.left = `${heartPosition.x}%`;

            if (checkCollision()) {
                // Heart caught
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                heartPosition.y = 0;
                heartPosition.x = Math.random() * 90 + 5;
                gameSpeed += 0.1; // Increase difficulty

                // Check for celebration
                if (score % 20 === 0) {
                    celebrate();
                }
            }

            requestAnimationFrame(updateHeart);
        }

        // Start the game
        updateHeart();
    </script>
</body>
</html>
